[package]
name = "ufs"
version = "0.1.5"
edition = "2024"
description = "ufs embed files and read from disk"
license = "MIT OR Apache-2.0"
repository = "https://github.com/p1mo/ufs"
readme = "README.md"
keywords = ["http", "assets", "include", "embed", "dir", "games", "static", "web", "server"]
categories = ["development-tools", "game-engines", "web-programming", "filesystem"]
authors = ["p1mo <101986259+p1mo@users.noreply.github.com>"]



[features]
default = []

archive-all = ["7z", "zip", "tar", "txz", "tgz"]

7z   = ["ufs-core/7z"]
zip  = ["ufs-core/zip"]
tar  = ["ufs-core/tar"]
txz  = ["ufs-core/txz"]
tgz  = ["ufs-core/tgz"]



[dependencies]
ufs-core = { path = "ufs-core" }
ufs-macros = { path = "ufs-macros" }



[[example]]
name = "basic"
path = "examples/basic.rs"