[package]
name = "ufs"
version = "0.1.3"
edition = "2024"
description = "ufs embed files and read from disk"
license = "MIT OR Apache-2.0"
repository = "https://github.com/p1mo/ufs"
readme = "README.md"
keywords = ["js", "ts", "deno", "plugins"]
categories = ["development-tools"]
authors = ["p1mo <101986259+p1mo@users.noreply.github.com>"]



[features]
default = []

all = ["7z", "zip", "tar", "txz", "tgz"]

7z   = ["dep:sevenz-rust2"]
zip  = ["dep:zip"]
tar  = ["dep:tar"]
txz  = ["dep:tar", "dep:xz2"]
tgz  = ["dep:tar", "dep:flate2"]


[build-dependencies]
cfg_aliases = "0.2.2"


[dev-dependencies]
anyhow = "1.0.104"
ufs = { path = ".", features = [ "all" ] }


[dependencies]
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }

thiserror = "2.0.21"

zip = { version = "9.0.4", optional = true }
tar = { version = "0.4.46", optional = true }
flate2 = { version = "1.1.10", optional = true }
xz2 = { version = "0.1.7", optional = true }
sevenz-rust2 = { version = "0.24.0", optional = true }


# internal macros
ufs-macros = { version = "0.1.1", path = "ufs-macros" }



[[example]]
name = "basic"
path = "examples/basic.rs"