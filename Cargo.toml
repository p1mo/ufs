[package]
name = "ufs"
version = "0.1.7"
edition = "2024"
rust-version = "1.85"
description = "Embed a directory at compile time or walk it at runtime, with optional built-in compression."
license = "MIT OR Apache-2.0"
repository = "https://github.com/p1mo/ufs"
readme = "README.md"
keywords = ["include", "embed", "dir", "static", "compression"]
categories = ["filesystem", "compression", "development-tools"]
authors = ["p1mo <101986259+p1mo@users.noreply.github.com>"]

[dependencies]
ufs-macros = { version = "0.1.5", path = "ufs-macros" }

[workspace]
members = [".", "ufs-macros"]
resolver = "2"

[[example]]
name = "basic"
path = "examples/basic.rs"
