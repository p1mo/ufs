[package]
name = "ufs-macros"
version = "0.1.4"
edition = "2024"

description = "macros for ufs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/p1mo/ufs/tree/main/ufs-macros"
readme = "README.md"
keywords = ["http", "assets", "include", "embed", "dir", "games", "static", "web", "server"]
categories = ["development-tools", "game-engines", "web-programming", "filesystem"]
authors = ["p1mo <101986259+p1mo@users.noreply.github.com>"]

[lib]
proc-macro = true
path = "src/lib.rs"

[dependencies]
ufs_core = { path = "../ufs-core" }

proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full"] }